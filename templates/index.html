<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyScore Predictor</title>
    <meta name="description" content="Predict your exam score based on study hours and attendance.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header>
            <h1>StudyScore</h1>
            <p>AI-Powered Exam Score Predictor</p>
        </header>

        <main>
            <div class="glass-card form-section">
                <h2>Your Details</h2>
                <form id="prediction-form">
                    <div class="input-group">
                        <label for="study_hours">Study Hours (per week)</label>
                        <input type="number" id="study_hours" name="study_hours" min="0" max="168" step="0.5" required placeholder="e.g. 10">
                    </div>
                    <div class="input-group">
                        <label for="attendance">Attendance (%)</label>
                        <input type="number" id="attendance" name="attendance" min="0" max="100" step="1" required placeholder="e.g. 85">
                    </div>
                    <button type="submit" id="predict-btn">
                        <span>Predict Score</span>
                        <div class="spinner" id="btn-spinner" style="display: none;"></div>
                    </button>
                </form>
            </div>

            <div class="glass-card result-section" id="result-section" style="display: none;">
                <h2>Predicted Score</h2>
                <div class="score-display">
                    <span id="predicted-score" class="score-value">--</span>
                    <span class="score-max">/ 100</span>
                </div>
                <div class="chart-container">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
